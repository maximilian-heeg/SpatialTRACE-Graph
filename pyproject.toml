[project]
name = "spatialtrace-graph"
version = "1.0.0rc2"
description = "Graph attention models for anatomical coordinates from spatial transcriptomics."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "anndata>=0.10,<0.13",
    "h5py>=3.8",
    "lightning>=2.2,<3",
    "matplotlib>=3.7,<4",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "pillow>=10",
    "pyarrow>=16",
    "pyyaml>=6",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11",
    "shapely>=2",
    "torch==2.12.1",
    "torch-geometric>=2.5,<3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
cpu = ["torch==2.12.1"]
cu126 = ["torch==2.12.1"]
dev = ["pytest>=8", "build>=1", "ruff>=0.12"]
docs = ["mkdocs>=1.6"]
figures = ["pypdf>=6", "reportlab>=4", "pymupdf>=1.26", "seaborn>=0.13", "statsmodels>=0.14", "pyarrow>=16", "pillow>=10"]
expression = ["scvi-tools>=1.4,<1.5"]

[project.scripts]
spatialtrace-graph = "spatial_axis_gat.cli:main"
tissuemapper-graph = "spatial_axis_gat.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
